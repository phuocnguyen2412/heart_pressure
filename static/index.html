<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quay Video PPG & Upload</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; }
        button { margin: 10px 0; padding: 10px; }
        .result-item {
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 10px;
            background: #f9f9f9;
        }
        .loading {
            color: gray;
            font-style: italic;
        }
    </style>
</head>
<body>

<h3>Chọn một hoặc nhiều video PPG để đo huyết áp</h3>
<input type="file" id="fileInput" accept="video/mp4,video/webm,video/MOV" multiple />
<button id="uploadBtn" disabled>Upload tới API</button>

<div id="result"></div>

<script>
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const result = document.getElementById('result');
    let filesToUpload = [];

    fileInput.onchange = () => {
        filesToUpload = Array.from(fileInput.files);
        uploadBtn.disabled = filesToUpload.length === 0;
    };
    const handleUpload = async (file) => {
        const formData = new FormData();
            formData.append('file', file, file.name);

            const loadingDiv = document.createElement('div');
            loadingDiv.className = "result-item loading";
            loadingDiv.textContent = `Đang xử lý: ${file.name}...`;
            result.appendChild(loadingDiv);

            try {
                const response = await fetch('http://171.244.46.201:8081/upload_ppg', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error("Lỗi server");
                const data = await response.json();

                const item = document.createElement('div');
                item.className = "result-item";
                const now = new Date().toLocaleString();

                item.innerHTML = `<b>${file.name}</b><br>
                    <i>Kết quả lúc: ${now}</i><br>
                    Huyết áp tâm thu (Systolic): <b>${data.systolic.toFixed(1)} mmHg</b><br>
                    Huyết áp tâm trương (Diastolic): <b>${data.diastolic.toFixed(1)} mmHg</b><br>
                    Huyết áp trung bình (Mean): <b>${data.mean.toFixed(1)} mmHg</b><br>
                    Nhịp tim (HR): <b>${data.hr ? data.hr.toFixed(1) : "?"} bpm</b>`;

                result.replaceChild(item, loadingDiv);
            } catch (err) {
                loadingDiv.textContent = `Lỗi khi xử lý file ${file.name}`;
                console.error(err);
            }
    }

    uploadBtn.onclick = async () => {
        if (filesToUpload.length === 0) return;
        uploadBtn.disabled = true;

        for (const file of filesToUpload) {
            handleUpload(file);
        }

        uploadBtn.disabled = false;
    };
</script>

</body>
</html>
