<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quay Video PPG & Upload</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 20px auto; }
        video { width: 100%; border: 1px solid #ccc; margin-bottom: 10px; }
        button { margin: 5px 0; }
    </style>
</head>
<body>
<input type="file" id="fileInput" accept="video/mp4,video/webm,video/MOV" />

<button id="uploadBtn" disabled>Upload tới API</button>
<div id="result"></div>
<script>
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const result = document.getElementById('result');
    let fileToUpload = null;

    fileInput.onchange = () => {
        fileToUpload = fileInput.files[0];
        uploadBtn.disabled = !fileToUpload;
    };

    uploadBtn.onclick = async () => {
        if (!fileToUpload) return;
        const formData = new FormData();
        formData.append('file', fileToUpload, fileToUpload.name);

        result.innerHTML = "Đang upload & xử lý...";
        uploadBtn.disabled = true;
        try {
            const response = await fetch('http://localhost:4000/upload_ppg', {
                method: 'POST',
                body: formData
            });
            if (!response.ok) throw new Error("Lỗi server");
            const data = await response.json();
            result.innerHTML = `<b>Kết quả đo huyết áp:</b><br>
                Huyết áp tâm thu (Systolic): <b>${data.systolic.toFixed(1)} mmHg</b><br>
                Huyết áp tâm trương (Diastolic): <b>${data.diastolic.toFixed(1)} mmHg</b><br>
                Huyết áp trung bình (Mean): <b>${data.mean.toFixed(1)} mmHg</b><br>
                Nhịp tim (HR): <b>${data.hr ? data.hr.toFixed(1) : "?"} bpm</b>`;
        } catch (err) {
            result.innerHTML = "Lỗi upload hoặc lỗi xử lý API!";
            console.error(err);
        } finally {
            uploadBtn.disabled = false;
        }
    };

</script>
</body>
</html>
